services:
  - type: web
    name: room911-laravel
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://room911-laravel.onrender.com
      - key: PORT
        value: 80
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: dpg-d1jeur6uk2gs7396lv9g-a.oregon-postgres.render.com
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: room_911_db
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        value: NzVnrU3wnsb4WIKpJGEPuVaCgFpZ7T9D
    healthCheckPath: /
